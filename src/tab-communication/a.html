<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>同源标签页通信示例 - A</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
    }

    h1 {
      margin-bottom: 8px;
    }

    fieldset {
      border: 1px solid #ddd;
      padding: 12px;
      margin: 12px 0;
    }

    legend {
      padding: 0 6px;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    input,
    button {
      font-size: 14px;
    }

    #log {
      height: 220px;
      border: 1px solid #ddd;
      padding: 8px;
      overflow: auto;
      background: #f9f9f9;
      white-space: pre-wrap;
    }

    .tag {
      display: inline-block;
      padding: 0 6px;
      border-radius: 3px;
      margin-right: 6px;
      color: #fff;
      font-size: 12px;
    }

    .in {
      background: #4caf50;
    }

    .out {
      background: #2196f3;
    }

    .info {
      background: #9e9e9e;
    }

    .warn {
      background: #ff9800;
    }
  </style>
</head>

<body>
  <h1>A 页面</h1>
  <p>点击下方按钮通过 <code>window.open</code> 打开同源的 B 页面，并用 <code>postMessage</code> 双向通信。</p>

  <button id="openB">打开 B 页面</button>

  <fieldset>
    <legend>发送给 B</legend>
    <label for="messageToB">消息内容</label>
    <input id="messageToB" type="text" value="你好，我是 A" style="width:100%;box-sizing:border-box;" />
    <button id="sendToB" style="margin-top:8px;">发送</button>
  </fieldset>

  <fieldset>
    <legend>消息日志</legend>
    <div id="log" aria-live="polite"></div>
  </fieldset>

  <script>
    const logEl = document.getElementById('log');
    let childWin = null;

    const appendLog = (text, tagClass) => {
      const entry = document.createElement('div');
      const tag = document.createElement('span');
      tag.className = `tag ${tagClass}`;
      tag.textContent = tagClass.toUpperCase();
      entry.appendChild(tag);
      entry.appendChild(document.createTextNode(text));
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    };

    document.getElementById('openB').addEventListener('click', () => {
      childWin = window.open('./b.html', '_blank');
      appendLog('已尝试打开 B 页面', 'info');
    });

    document.getElementById('sendToB').addEventListener('click', () => {
      if (!childWin || childWin.closed) {
        appendLog('B 页面未打开或已关闭', 'warn');
        return;
      }
      const msg = document.getElementById('messageToB').value || '来自 A 的问候';
      childWin.postMessage({ from: 'A', msg }, location.origin);
      appendLog(`向 B 发送: ${msg}`, 'out');
    });

    window.addEventListener('message', (event) => {
      if (event.origin !== location.origin) return;
      const data = event.data || {};
      const content = data.msg || data.reply || JSON.stringify(data);
      appendLog(`收到来自 ${data.from || '未知'} 的消息: ${content}`, 'in');
    });
  </script>
</body>

</html>
